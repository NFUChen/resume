name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Inject LiteLLM API key
      env:
        LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      run: |
        node -e '
          const fs = require("fs");
          const path = "src/app/chat/chat.config.ts";
          const placeholder = "__LITELLM_API_KEY__";
          const apiKey = process.env.LITELLM_API_KEY;

          if (!apiKey) {
            throw new Error("LITELLM_API_KEY repository secret is not configured");
          }

          const source = fs.readFileSync(path, "utf8");
          if (!source.includes(placeholder)) {
            throw new Error("LiteLLM API key placeholder was not found");
          }

          fs.writeFileSync(path, source.replace(placeholder, apiKey));
        '

    - name: Build Angular app
      run: npm run build -- --configuration production --base-href="./"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.GH_PAT }}
        publish_dir: ./dist/resume/browser