<div class="navbar bg-base-100 shadow-lg fixed top-0 z-50">
  <div class="navbar-start">
    <div class="dropdown">
      <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
        </svg>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
        @for (item of navItems; track item.page) {
          <li>
            <a [routerLink]="['/']" [queryParams]="{page: item.page}" routerLinkActive="active" class="flex items-center gap-2">
              <span>{{ item.icon }}</span>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
    <a class="btn btn-ghost text-xl">William Chen</a>
  </div>
  <div class="navbar-center hidden lg:flex">
    <ul class="menu menu-horizontal px-1">
      @for (item of navItems; track item.page) {
        <li>
          <a [routerLink]="['/']" [queryParams]="{page: item.page}" routerLinkActive="active" class="flex items-center gap-2">
            <span>{{ item.icon }}</span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </div>
  <div class="navbar-end flex items-center space-x-5">
    <a href="mailto:ow6201231@gmail.com" class="btn btn-primary">聯絡我</a>
    <app-theme-toggler class="mr-2"></app-theme-toggler>
  </div>
</div>

<!-- Spacer to prevent content from hiding behind fixed navbar -->
<div class="h-16"></div>
