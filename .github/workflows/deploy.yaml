name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Inject chat endpoint and API key
      env:
        CHAT_ENDPOINT: ${{ secrets.CHAT_ENDPOINT }}
        CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
      run: |
        node -e '
          const fs = require("fs");
          const path = "src/app/chat/chat.config.ts";
          const replacements = [
            { placeholder: "__ENDPOINT__", secret: "CHAT_ENDPOINT" },
            { placeholder: "__API_KEY__", secret: "CHAT_API_KEY" }
          ];

          let source = fs.readFileSync(path, "utf8");
          for (const { placeholder, secret } of replacements) {
            const value = process.env[secret];
            if (!value) {
              throw new Error(`${secret} repository secret is not configured`);
            }
            if (!source.includes(placeholder)) {
              throw new Error(`${placeholder} placeholder was not found in ${path}`);
            }
            source = source.replace(placeholder, () => value);
          }

          fs.writeFileSync(path, source);
        '

    - name: Build Angular app
      run: npm run build -- --configuration production --base-href="./"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.GH_PAT }}
        publish_dir: ./dist/resume/browser